name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # run by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-repo:
    name: "Public repo: no strategy code or market data"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-public.sh

  ci:
    # The org's shared pipeline: formatting, build, tests, architecture, coverage gate, secret and dependency scans.
    # No images from this public repo: the deployable images (engine + private strategies) are built in the private
    # optionsdesk-hq/strategies repo (INC-2026-004).
    uses: optionsdesk-hq/.github/.github/workflows/java-ci.yml@main
    with:
      image-tasks: ""
    permissions:
      contents: read
      packages: write   # required by the shared pipeline's (skipped) image job
