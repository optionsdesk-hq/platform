# One place for every dependency version. Spring Boot's BOM manages the Spring, Micrometer, JUnit and AssertJ
# versions used by the apps; the shared kernel (no Spring) pins its own test libraries here.
[versions]
springBoot = "3.3.5"
springModulith = "1.2.5"
archunit = "1.3.0"
jqwik = "1.9.1"
junit = "5.11.3"
assertj = "3.26.3"
jackson = "2.18.1"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
